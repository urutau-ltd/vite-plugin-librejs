---
name: Deno CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configure Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Formatting Check
              run: deno fmt --check

            - name: Type Check
              run: deno check

            - name: Lint
              run: deno lint

            - name: Unit testing
              run: deno test -P
...
